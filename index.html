<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áruház</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Áruház</h1>

        <div class="csvFeltoltes">
            <label for="csvFile">Termékek importálása:</label>
            <input type="file" id="csvFile" accept=".csv" onchange="importTermekekCSV(aruhaz)">
        </div>

        <div class="termekekLista">
            <h2>Termékek:</h2>
            <ul id="termekLista">

            </ul>
        </div>

        <div class="vasarlas">
            <h2>Vásárlás:</h2>
            <label for="termekNev">Termék neve:</label>
            <input type="text" id="termekNev" placeholder="Írd be a termék nevét">
            <button onclick="vasarlas()">Vásárlás</button>
        </div>

        <div class="frissitettTermek">
            <h2>Termék frissítése:</h2>
            <label for="frissitettNev">Termék neve:</label>
            <input type="text" id="frissitettNev" placeholder="Írd be a termék nevét">

            <label for="frissitettAr">Új ár:</label>
            <input type="number" id="frissitettAr" placeholder="Új ár">

            <label for="frissitettKeszlet">Új készlet:</label>
            <input type="number" id="frissitettKeszlet" placeholder="Új készlet">

            <button onclick="frissitettTermek()">Frissítés</button>
        </div>

        <div class="kategoriaSzures">
            <h2>Kategória szűrés:</h2>
            <label for="kategoriaSzures">Válassz kategóriát:</label>

            <select id="kategoriaSzures" onchange="kategoriaSzures()">
                <option value="">--Válassz egy kategóriát--</option>
                <option value="Gyümölcs">Gyümölcs</option>
                <option value="Pékáru">Pékáru</option>
                <option value="Zöldség">Zöldség</option>
            </select>

        </div>
    </div>

    <script>
        //Feladat 1
        class Termek {
            constructor(neve, ara, raktarKeszlet, kategoria) {
                this.neve = neve;
                this.ara = ara;
                this.raktarKeszlet = raktarKeszlet;
                this.kategoria = kategoria;
            }

            megjelenit() {
                return `${this.neve}, ${this.ara} Ft, ${this.raktarKeszlet} db, ${this.kategoria}`;
            }

            csokkentRaktarKeszlet() {
                if (this.raktarKeszlet > 0) {
                    this.raktarKeszlet -= 1;
                    return `Új készlet: ${this.raktarKeszlet} db`;
                } else {
                    return `A termék nincs raktáron.`;
                }
            }
        }

        //Feladat 2
        class Aruhaz {
            constructor() {
                this.termekek = [];
            }

            termekHozzaad(termek) {
                this.termekek.push(termek);
            }

            osszesTermekMegjelenitese() {
                this.termekek.forEach(termek => {
                    termek.megjelenit();
                });
            }

            termekVasarlas(nev) {
                const termek = this.termekek.find(t => t.neve === nev);
                if (termek) {
                    return termek.csokkentRaktarKeszlet();
                } else {
                    return `A termék nem található.`;
                }
            }
        }

        //Feladat 3
        function importTermekekCSV(csvFile, aruhaz) {
            const reader = new FileReader();

            reader.onload = function (event) {
                const csvContent = event.target.result;
                const rows = csvContent.split('\n');

                const termekListaElem = document.getElementById("termekLista");
                termekListaElem.innerHTML = '';

                rows.forEach(row => {
                    const [nev, ar, raktarKeszlet, kategoria] = row.split(',');

                    const termek = new Termek(nev.trim(), parseInt(ar.trim()), parseInt(raktarKeszlet.trim()), kategoria.trim());
                    aruhaz.termekHozzaad(termek);

                    const listaelem = document.createElement("li");
                    listaelem.textContent = termek.megjelenit();
                    termekListaElem.appendChild(listaelem);
                });
            };

            reader.readAsText(csvFile);
        }


        //Feladat 4
        function vasarlasFunkcio(aruhaz) {
            const termekNev = prompt("Add meg a vásárolni kívánt termék nevét:");

            const eredmeny = aruhaz.termekVasarlas(termekNev);
            alert(eredmeny);
        }

        //Extra 1
        function frissitesTermek(termekNev, ujAr, ujKeszlet) {
            const termek = aruhaz.termekek.find(t => t.neve === termekNev);
            if (termek) {
                termek.ara = ujAr;
                termek.raktarKeszlet = ujKeszlet;
                alert(`A ${termekNev} termék frissítve lett! Új ár: ${ujAr} Ft, Új készlet: ${ujKeszlet} db`);
                aruhaz.osszesTermekMegjelenitese();
            } else {
                alert('A keresett termék nem található!');
            }
        }

        //Extra 2
        function kategoriaSzures() {
            const kivalasztottKategoria = document.getElementById('kategoriaSzures').value;
            if (kivalasztottKategoria) {
                kategoriakSzerintiSzures(kivalasztottKategoria);
            } else {
                aruhaz.osszesTermekMegjelenitese();
            }
        }
    </script>
</body>

</html>
